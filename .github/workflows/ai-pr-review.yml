name: AI Pull Request Review & Summary

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Run AI Code Review
        uses: petarzarkov/gemini-code-review-action@v1.1.3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summarize:
    runs-on: ubuntu-latest
    needs: review
    steps:
      - name: Generate AI Summary
        uses: SUBHAZIT/PRGPT@v2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}