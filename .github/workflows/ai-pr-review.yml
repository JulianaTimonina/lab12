name: AI Pull Request Review & Summary (GitHub Models)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate AI Summary with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 1. Получаем diff через GitHub CLI
          DIFF=$(gh pr diff "$PR_NUMBER")

          if [ -z "$DIFF" ]; then
            DIFF="Нет изменений для описания."
          fi

          # 2. Формируем промпт
          PROMPT="Ты — полезный ассистент. Опиши кратко и структурированно изменения в этом Pull Request на русском языке. Вот diff:\n\n$DIFF"
          ESCAPED_PROMPT=$(echo "$PROMPT" | jq -Rs .)

          # 3. Собираем JSON-запрос для GitHub Models API
          JSON_PAYLOAD=$(jq -n \
            --arg prompt "$ESCAPED_PROMPT" \
            '{
              model: "openai/gpt-4o-mini",
              messages: [
                { role: "system", content: "Ты — полезный ассистент." },
                { role: "user", content: ($prompt | fromjson) }
              ]
            }')

          # 4. Отправляем запрос к GitHub Models
          RESPONSE=$(curl -s -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d "$JSON_PAYLOAD")

          # 5. Извлекаем результат
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Не удалось получить описание"')

          # 6. Публикуем комментарий в PR
          gh pr comment "$PR_NUMBER" --body "## 🤖 AI Summary (via GitHub Models)\n\n$SUMMARY"