<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление тарифами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h3>Тарифы</h3>
        <button class="btn btn-primary mb-3" onclick="clearForm()" data-bs-toggle="modal" data-bs-target="#tariffModal">Добавить тариф</button>
        <table class="table table-bordered">
            <thead><tr><th>ID</th><th>Название</th><th>Подача</th><th>Цена/км</th><th>Валюта</th><th>Описание</th><th>Действия</th></tr></thead>
            <tbody id="tariffsTable"></tbody>
        </table>
        <div class="modal fade" id="tariffModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header"><h5 class="modal-title">Тариф</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <form id="tariffForm">
                        <div class="modal-body">
                            <input type="hidden" id="tariffId">
                            <div class="mb-3"><label>Название</label><input type="text" id="tname" class="form-control" required></div>
                            <div class="mb-3"><label>Базовая цена</label><input type="number" step="0.01" id="base_fee" class="form-control" value="0"></div>
                            <div class="mb-3"><label>Цена за км</label><input type="number" step="0.01" id="price_per_km" class="form-control" required></div>
                            <div class="mb-3"><label>Валюта</label><input type="text" id="currency" class="form-control" value="USD"></div>
                            <div class="mb-3"><label>Описание</label><textarea id="description" class="form-control"></textarea></div>
                        </div>
                        <div class="modal-footer"><button type="submit" class="btn btn-primary">Сохранить</button></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/main.js"></script>
    <script>
        let tariffs = [];
        async function loadTariffs() {
            tariffs = await fetchWithAuth('/tariffs');
            const tbody = document.getElementById('tariffsTable');
            tbody.innerHTML = tariffs.map(t => `
                <tr>
                    <td>${t.id}</td>
                    <td>${t.name}</td>
                    <td>${t.base_fee}</td>
                    <td>${t.price_per_km}</td>
                    <td>${t.currency}</td>
                    <td>${t.description || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1" onclick="editTariff(${t.id})">Изменить</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteTariff(${t.id})">Удалить</button>
                    </td>
                </tr>
            `).join('');
        }

        function editTariff(id) {
            const t = tariffs.find(t => t.id === id);
            document.getElementById('tariffId').value = t.id;
            document.getElementById('tname').value = t.name;
            document.getElementById('base_fee').value = t.base_fee;
            document.getElementById('price_per_km').value = t.price_per_km;
            document.getElementById('currency').value = t.currency;
            document.getElementById('description').value = t.description || '';
            new bootstrap.Modal(document.getElementById('tariffModal')).show();
        }

        function clearForm() {
            document.getElementById('tariffForm').reset();
            document.getElementById('tariffId').value = '';
        }

        document.getElementById('tariffForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('tariffId').value;
            const payload = {
                name: document.getElementById('tname').value,
                base_fee: parseFloat(document.getElementById('base_fee').value) || 0,
                price_per_km: parseFloat(document.getElementById('price_per_km').value),
                currency: document.getElementById('currency').value,
                description: document.getElementById('description').value
            };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/tariffs/${id}` : '/tariffs';
            await fetchWithAuth(url, method, payload);
            bootstrap.Modal.getInstance(document.getElementById('tariffModal')).hide();
            loadTariffs();
        });

        async function deleteTariff(id) {
            if (!confirm('Удалить тариф?')) return;
            await fetchWithAuth(`/tariffs/${id}`, 'DELETE');
            loadTariffs();
        }

        loadTariffs();
    </script>
</body>
</html>
