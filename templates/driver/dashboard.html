<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель водителя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between">
            <h3>Мои заказы</h3>
            <button class="btn btn-danger" onclick="logout()">Выйти</button>
        </div>
        <hr>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Откуда → Куда</th>
                    <th>Статус</th>
                    <th>Клиент</th>
                    <th>Стоимость</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
        </table>
    </div>
    <script src="/static/main.js"></script>
    <script>
        async function loadOrders() {
            const orders = await fetchWithAuth('/orders');
            const tbody = document.getElementById('ordersTable');
            tbody.innerHTML = orders.map(o => {
                let actions = '';
                if (o.status === 'assigned') {
                    actions = `<button class="btn btn-sm btn-success me-1" onclick="updateOrder(${o.id}, 'accept')">Принять</button>
                               <button class="btn btn-sm btn-warning" onclick="updateOrder(${o.id}, 'cancel')">Отклонить</button>`;
                } else if (o.status === 'accepted') {
                    actions = `<button class="btn btn-sm btn-primary" onclick="updateOrder(${o.id}, 'start')">Начать поездку</button>`;
                } else if (o.status === 'in_progress') {
                    actions = `<button class="btn btn-sm btn-success" onclick="updateOrder(${o.id}, 'complete')">Завершить</button>`;
                }
                return `
                    <tr>
                        <td>${o.id}</td>
                        <td>${o.pickup_address} → ${o.destination_address}</td>
                        <td>${o.status}</td>
                        <td>${o.customer_name || '-'}</td>
                        <td>${o.cost}</td>
                        <td>${actions}</td>
                    </tr>
                `;
            }).join('');
        }

        async function updateOrder(id, action) {
            const endpoints = {
                accept: `/orders/${id}/accept`,
                start: `/orders/${id}/start`,
                complete: `/orders/${id}/complete`
            };
            if (action === 'cancel') {
                // Водитель не отменяет заказ, но можно добавить, если потребуется
                alert('Отмена не реализована для водителя');
                return;
            }
            await fetchWithAuth(endpoints[action], 'PATCH');
            loadOrders();
        }

        loadOrders();
    </script>
</body>
</html>
